repository_name:
  type: str
  help: Short name of the repository, must be a python identifier
  default: my_repo
  when: false

repository_human_name:
  type: str
  help: Human readable name of the repository
  default: My Repository

repository_description:
  type: str
  multiline: true
  help: Description of the repository
  default: My Repository description

languages:
  type: str
  help: |
    List of languages to use in the repository,
    2 letter code separated by either comma or space.
    English is implicit, do not include it.

use_ccmm:
  type: bool
  help: |
    Will you add ccmm  (czech core metadata model) based models?
    This will add the correct dependencies to your project.
    Note that using this option will automatically use ccmm
    vocabularies in place of default RDM vocabularies.

_jinja_extensions:
  - copier_templates_extensions.TemplateExtensionLoader
  - copier.py:NRPExtension
  - copier.py:ContextUpdater

_templates_suffix: .copier

_subdirectory: template
